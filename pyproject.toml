[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[project]
name = "module-01-text-classification"
version = "0.1.0"
description = "Research project on stopword removal impact in text classification."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "hydra-core>=1.3.3",
    "matplotlib>=3.10.9",
    "mlflow>=3.14.0",
    "nltk>=3.9.4",
    "numpy>=2.2.6",
    "omegaconf>=2.3.1",
    "pandas>=2.3.3",
    "scikit-learn>=1.7.2",
    "seaborn>=0.13.2",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[dependency-groups]
dev = [
    "jupyterlab>=4.5.8",
    "ruff>=0.15.18",
]
